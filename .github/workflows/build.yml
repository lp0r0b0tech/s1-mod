name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration:
          #- Debug
          - Release
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          
      - name: Check out files
        uses: actions/checkout@v4.2.0
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.configuration}}
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:Platform=x64 build/s1x.sln

      - name: Upload ${{matrix.configuration}} binary
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} Binary
          path: |
            build/bin/x64/${{matrix.configuration}}/s1x.exe

      - name: Upload fork ${{matrix.configuration}} binary
        if: >-
          matrix.configuration == 'Release' &&
          github.repository_owner == 'lp0r0b0tech' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/lp0r0b0tech-font-pool-startup-diagnostic'
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} Binary
          path: build/bin/x64/${{matrix.configuration}}/s1x.exe

      - name: Upload Tracer diagnostic ${{ matrix.configuration }} binary
        if: >-
          matrix.configuration == 'Release' &&
          (github.repository == 'CBServers/s1-mod' || github.repository == 'lp0r0b0tech/s1-mod') &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/lp0r0b0tech-opt-in-tracer-pool-probe'
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{ matrix.configuration }} Tracer diagnostic Binary
          path: build/bin/x64/${{ matrix.configuration }}/s1x.exe

      - name: Upload LOADED_SOUND diagnostic pull request binary
        if: >-
          matrix.configuration == 'Release' &&
          github.repository == 'lp0r0b0tech/s1-mod' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'lp0r0b0tech-opt-in-tracer-pool-probe' &&
          github.head_ref == 'lp0r0b0tech-h2o-sound-pool-capacity'
        uses: actions/upload-artifact@v4.4.0
        with:
          name: Release LOADED_SOUND diagnostic Binary
          path: build/bin/x64/Release/s1x.exe
            
      - name: Upload ${{matrix.configuration}} data artifacts
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} data artifacts
          path: |
            data/*

  deploy:
    name: Deploy artifacts
    needs: build
    runs-on: windows-2022
    if: github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    steps:
      - name: Download Release binaries
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release Binary

      - name: Download Release data artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release data artifacts
          path: data

      - name: Download hashing executable
        run: |
          Invoke-WebRequest -Uri "https://github.com/CBServers/updater/releases/latest/download/update-hasher.exe" -OutFile "update-hasher.exe"

      - name: Generate hashed.json
        run: |
          .\update-hasher.exe

      - name: Set artifact folder name
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/develop") {
            echo "ARTIFACT_FOLDER=s1x-dev" >> $env:GITHUB_ENV
          } else {
            echo "ARTIFACT_FOLDER=s1x" >> $env:GITHUB_ENV
          }

      - name: Move files to artifact folder and rename hashes
        run: |
          mkdir ${{ env.ARTIFACT_FOLDER }}
          Move-Item -Path .\s1x.exe -Destination .\${{ env.ARTIFACT_FOLDER }}\
          Move-Item -Path .\data -Destination .\${{ env.ARTIFACT_FOLDER }}\
          mv hashed.json ${{ env.ARTIFACT_FOLDER }}.json

      - name: Clone updater
        run: |
          git config --global user.name 'CBServers'
          git config --global user.email '${{ secrets.OWNER_EMAIL }}'
          $env:GIT_TERMINAL_PROMPT=0
          $env:GIT_USERNAME="CBServers"
          $env:GIT_PASSWORD="${{ secrets.REPO_PAT }}"
          git clone https://$env:GIT_USERNAME:$env:GIT_PASSWORD@github.com/CBServers/updater.git

      - name: Copy files to updater and cleanup
        run: |
          $target = '.\updater\updater\${{ env.ARTIFACT_FOLDER }}'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          # Wipe the payload so files dropped from the build stop being shipped
          Get-ChildItem -Path $target -Force | Remove-Item -Recurse -Force
          Copy-Item -Path .\${{ env.ARTIFACT_FOLDER }}.json -Destination .\updater\updater\ -Force
          Copy-Item -Path .\${{ env.ARTIFACT_FOLDER }}\* -Destination $target\ -Recurse -Force
          Remove-Item -Path .\${{ env.ARTIFACT_FOLDER }}.json -Force
          Remove-Item -Path .\${{ env.ARTIFACT_FOLDER }} -Recurse -Force
          Remove-Item -Path .\update-hasher.exe -Force

      - name: Push changes to updater
        run: |
          cd updater
          git add .
          git commit -m "Update artifacts"
          git push origin main
